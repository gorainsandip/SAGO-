<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAGO Admin</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="bar"><div class="brand">SAGO ADMIN</div><div class="actions"><a class="btn primary" href="index.html">Store</a><button class="primary" id="logout">Logout</button></div></div></header><main class="wrap"><div id="gate" class="panel">Admin access পরীক্ষা হচ্ছে...</div><div id="app" class="hidden"><section class="panel"><h2>পণ্য যোগ করুন</h2><div class="form"><div class="row"><input id="name" placeholder="Product name"><input id="categoryId" placeholder="Category ID"></div><div class="row"><input id="price" type="number" placeholder="Price"><input id="discountPrice" type="number" placeholder="Discount price"></div><div class="row"><input id="stock" type="number" placeholder="Stock"><input id="imageUrl" placeholder="Image URL"></div><textarea id="description" placeholder="Description"></textarea><button class="dark" id="add">Add Product</button></div><div id="msg" class="msg"></div></section><section class="panel"><h2>Products</h2><div id="products" class="grid"></div><div class="pager"><button id="more" class="dark">আরও পণ্য</button></div></section><section class="panel"><h2>Orders</h2><div id="orders"></div><button id="moreOrders" class="dark">আরও Orders</button></section></div></main><script type="module">
import{auth,db}from'./js/config.js';import{onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';import{doc,getDoc,collection,query,orderBy,limit,getDocs,startAfter,addDoc,serverTimestamp,deleteDoc}from'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';const $=id=>document.getElementById(id),SIZE=24;let pc=null,oc=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=n=>'৳'+Number(n||0).toLocaleString('en-IN');
onAuthStateChanged(auth,async u=>{if(!u){$('gate').textContent='আগে Login করুন।';return}let a=await getDoc(doc(db,'admins',u.uid));if(!a.exists()||!['owner','admin'].includes(a.data().role)){$('gate').textContent='আপনার Admin permission নেই।';return}$('gate').classList.add('hidden');$('app').classList.remove('hidden');loadProducts(true);loadOrders(true)});$('logout').onclick=()=>signOut(auth).then(()=>location.href='login.html');
async function loadProducts(reset){let q=reset?query(collection(db,'products'),orderBy('createdAt','desc'),limit(SIZE)):query(collection(db,'products'),orderBy('createdAt','desc'),startAfter(pc),limit(SIZE));let s=await getDocs(q);if(reset)$('products').innerHTML='';s.docs.forEach(d=>{let p=d.data(),el=document.createElement('div');el.className='card';el.innerHTML=`<div class="body"><b>${esc(p.name)}</b><p>${money(p.discountPrice??p.price)}</p><p class="small">Stock: ${p.stock??0}</p><button class="danger">Delete</button></div>`;el.querySelector('button').onclick=async()=>{await deleteDoc(doc(db,'products',d.id));el.remove()};$('products').appendChild(el)});pc=s.docs.at(-1)||pc;$('more').disabled=s.docs.length<SIZE}$('more').onclick=()=>loadProducts(false);
$('add').onclick=async()=>{try{let name=$('name').value.trim();if(!name)throw Error('Product name দিন');let price=Number($('price').value),dp=$('discountPrice').value===''?null:Number($('discountPrice').value);await addDoc(collection(db,'products'),{name,nameLower:name.toLowerCase(),categoryId:$('categoryId').value.trim(),price,discountPrice:dp,stock:Number($('stock').value||0),imageUrl:$('imageUrl').value.trim(),description:$('description').value.trim(),active:true,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});$('msg').textContent='পণ্য যোগ হয়েছে।';pc=null;loadProducts(true)}catch(e){$('msg').textContent=e.message}};
async function loadOrders(reset){let q=reset?query(collection(db,'orders'),orderBy('createdAt','desc'),limit(SIZE)):query(collection(db,'orders'),orderBy('createdAt','desc'),startAfter(oc),limit(SIZE));let s=await getDocs(q);if(reset)$('orders').innerHTML='';s.docs.forEach(d=>{let o=d.data(),el=document.createElement('div');el.className='order';el.innerHTML=`<b>${esc(o.customerName||'Customer')}</b><br>Mobile: ${esc(o.mobile||'')}<br>Address: ${esc(o.address||'')}<br>Total: ${money(o.total)}<br><span class="small">${esc(d.id)}</span>`;$('orders').appendChild(el)});oc=s.docs.at(-1)||oc;$('moreOrders').disabled=s.docs.length<SIZE}$('moreOrders').onclick=()=>loadOrders(false);
</script></body></html>
