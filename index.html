<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAGO Store</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="bar"><div class="brand">SAGO STORE</div><div class="actions"><a class="btn primary" href="login.html">Login</a><a class="btn primary" href="admin.html">Admin</a></div></div></header><main class="wrap"><div class="search"><input id="search" placeholder="পণ্যের নাম দিয়ে খুঁজুন..."><button class="dark" id="go">Search</button></div><div id="status" class="msg">পণ্য লোড হচ্ছে...</div><section id="products" class="grid"></section><div class="pager"><button id="prev" class="light">← আগের</button><span id="page">Page 1</span><button id="next" class="dark">পরের →</button></div></main><script type="module">
import{db}from './js/config.js';import{collection,query,where,orderBy,limit,getDocs,startAfter,endAt,startAt}from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';
const SIZE=24;let cursor=null,page=1;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function money(n){return'৳'+Number(n||0).toLocaleString('en-IN')};function render(ds){$('products').innerHTML=ds.map(d=>{let p=d.data(),price=p.discountPrice??p.price??0;return`<article class="card"><img loading="lazy" src="${p.imageUrl||'https://via.placeholder.com/500x350?text=SAGO'}" alt=""><div class="body"><b>${esc(p.name||'Unnamed')}</b><p class="muted">${esc(p.description||'')}</p><div class="price">${money(price)} ${p.discountPrice&&p.price?`<span class="old">${money(p.price)}</span>`:''}</div><div class="small">Stock: ${p.stock??0}</div></div></article>`}).join('')||'<p>কোনো পণ্য পাওয়া যায়নি।</p>'}
async function load(reset=true){try{if(reset){cursor=null;page=1}let term=$('search').value.trim().toLowerCase(),q;if(term)q=query(collection(db,'products'),where('active','==',true),orderBy('nameLower'),startAt(term),endAt(term+'\uf8ff'),limit(SIZE));else q=cursor?query(collection(db,'products'),where('active','==',true),orderBy('createdAt','desc'),startAfter(cursor),limit(SIZE)):query(collection(db,'products'),where('active','==',true),orderBy('createdAt','desc'),limit(SIZE));$('status').textContent='লোড হচ্ছে...';let s=await getDocs(q);render(s.docs);cursor=s.docs.at(-1)||null;$('page').textContent='Page '+page;$('prev').disabled=page===1;$('next').disabled=s.docs.length<SIZE;$('status').textContent=`এই পাতায় ${s.docs.length}টি পণ্য দেখানো হচ্ছে।`}catch(e){console.error(e);$('status').textContent='লোড হয়নি। Firebase index/Rules পরীক্ষা করুন।'}}
$('go').onclick=()=>load(true);$('search').onkeydown=e=>{if(e.key==='Enter')load(true)};$('next').onclick=()=>{if(!$('next').disabled){page++;load(false)}};$('prev').onclick=()=>{if(page>1){location.reload()}};load();
</script></body></html>
