<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAGO Login</title><link rel="stylesheet" href="css/style.css"></head><body><main class="wrap"><div class="panel" style="max-width:520px;margin:30px auto"><h2>SAGO Login / Signup</h2><div class="form"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div class="row"><button class="dark" id="login">Login</button><button class="light" id="signup">Signup</button></div></div><div id="msg" class="msg">Firebase Authentication ব্যবহার হচ্ছে।</div><a href="index.html">← Store</a></div></main><script type="module">import{auth}from'./js/config.js';import{signInWithEmailAndPassword,createUserWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';const $=id=>document.getElementById(id);async function run(fn){try{let c=await fn();$('msg').textContent='সফল হয়েছে। UID: '+c.user.uid;setTimeout(()=>location.href='index.html',700)}catch(e){$('msg').textContent=e.message}}$('login').onclick=()=>run(()=>signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value));$('signup').onclick=()=>run(()=>createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value));</script></body></html>
