<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Sandip Store</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    :root{
      --bg:#0b0b0f; --card:rgba(255,255,255,0.05); --border:rgba(255,255,255,0.09);
      --primary:#7c6cff; --primary-dark:#6a5ae0; --text:#f2f2f2; --muted:#9999aa;
      --success:#00c853; --danger:#ff3b5c;
    }
    body{background:linear-gradient(160deg,#0b0b0f 0%,#12121a 40%,#0f1525 100%);color:var(--text);min-height:100vh;padding-bottom:80px}
    .header{position:sticky;top:0;z-index:90;background:rgba(11,11,15,0.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
    .logo{font-size:20px;font-weight:700;cursor:pointer;user-select:none}
    .logo span{color:var(--primary)}
    .header-right{display:flex;align-items:center;gap:10px}
    .cart-btn{position:relative;background:var(--card);border:1px solid var(--border);width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
    .cart-count{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:11px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
    .container{max-width:1100px;margin:0 auto;padding:16px}
    .search-wrap{margin-bottom:20px}
    .search-wrap input{width:100%;padding:13px 16px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:15px;outline:none}
    .search-wrap input:focus{border-color:var(--primary)}
    .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;backdrop-filter:blur(12px);transition:0.2s;cursor:pointer}
    .card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,0.35)}
    .card-img{height:170px;background:#161622;display:flex;align-items:center;justify-content:center;font-size:42px;color:var(--muted)}
    .card-img img{width:100%;height:100%;object-fit:cover}
    .card-body{padding:14px}
    .card-title{font-size:15px;font-weight:600;margin-bottom:4px}
    .card-price{color:var(--primary);font-size:17px;font-weight:700;margin-bottom:10px}
    .btn{padding:9px 12px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:0.15s}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark)}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-success{background:var(--success);color:#fff}
    .btn-block{width:100%}
    .admin-box{display:none;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:22px}
    .admin-box.show{display:block}
    .admin-box h3{font-size:17px;margin-bottom:12px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    .form-grid input,.form-grid textarea,.admin-box input,.admin-box textarea{width:100%;padding:11px 13px;border-radius:10px;background:rgba(0,0,0,0.28);border:1px solid var(--border);color:var(--text);font-size:14px;outline:none}
    .form-grid textarea{grid-column:1/-1;min-height:70px;resize:vertical}
    .admin-section{margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
    .admin-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:14px}
    .cart-drawer{position:fixed;top:0;right:-100%;width:100%;max-width:380px;height:100%;background:#12121a;border-left:1px solid var(--border);z-index:120;transition:right 0.3s ease;display:flex;flex-direction:column}
    .cart-drawer.open{right:0}
    .cart-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .cart-body{flex:1;overflow-y:auto;padding:14px}
    .cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
    .cart-item-info{flex:1}
    .cart-item-name{font-size:14px;font-weight:600}
    .cart-item-price{font-size:13px;color:var(--primary);margin-top:3px}
    .cart-footer{padding:16px;border-top:1px solid var(--border)}
    .cart-total{display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin-bottom:12px}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:110}
    .overlay.show{display:block}
    .orders-box{display:none;margin-top:28px}
    .orders-box.show{display:block}
    .order-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;font-size:14px}
    .order-card .meta{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.5}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:130;align-items:center;justify-content:center;padding:16px}
    .modal.show{display:flex}
    .modal-box{background:#161622;border:1px solid var(--border);border-radius:18px;width:100%;max-width:420px;padding:22px;max-height:90vh;overflow-y:auto}
    .modal-box h3{margin-bottom:14px;font-size:18px}
    .modal-box input,.modal-box textarea{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;background:rgba(0,0,0,0.3);border:1px solid var(--border);color:var(--text);font-size:14px;outline:none}
    .modal-box textarea{min-height:75px;resize:vertical}
    .modal-actions{display:flex;gap:10px;margin-top:6px}
    .modal-actions .btn{flex:1}
    .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
    .badge{background:var(--primary);color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px}
    .detail-img{width:100%;height:260px;background:#161622;border-radius:14px;overflow:hidden;margin-bottom:16px;display:flex;align-items:center;justify-content:center;font-size:60px;color:var(--muted)}
    .detail-img img{width:100%;height:100%;object-fit:cover}
    .detail-title{font-size:20px;font-weight:700;margin-bottom:6px}
    .detail-price{color:var(--primary);font-size:22px;font-weight:700;margin-bottom:12px}
    .detail-desc{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:18px;white-space:pre-wrap}
    .qty-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .qty-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--text);font-size:18px;cursor:pointer}
    .qty-val{min-width:30px;text-align:center;font-weight:700;font-size:16px}
    @media(max-width:600px){
      .products{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
      .card-img{height:140px;font-size:34px}
      .form-grid{grid-template-columns:1fr}
      .detail-img{height:220px}
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo" id="logoBtn">Sandip <span>Store</span></div>
    <div class="header-right">
      <div class="cart-btn" onclick="toggleCart()">🛒<div class="cart-count" id="cartCount">0</div></div>
      <button class="btn btn-outline" id="logoutBtn" style="display:none;padding:7px 12px;font-size:12px" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="admin-box" id="adminPanel">
      <h3>Admin Panel <span class="badge" id="adminBadge">Owner</span></h3>
      <div class="form-grid">
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Price (৳)">
        <textarea id="pDesc" placeholder="Full Description (features, what works etc.)"></textarea>
      </div>
      <div style="margin-bottom:12px">
        <label style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px">Product Photo (Gallery)</label>
        <input type="file" id="pImageFile" accept="image/*" style="width:100%;padding:10px;border-radius:10px;background:rgba(0,0,0,0.28);border:1px solid var(--border);color:var(--text);font-size:13px">
        <div id="imagePreview" style="margin-top:10px;display:none">
          <img id="previewImg" style="max-width:120px;max-height:120px;border-radius:10px;object-fit:cover">
        </div>
      </div>
      <button class="btn btn-primary" onclick="addProduct()">+ Add Product</button>

      <div class="admin-section" id="ownerOnlySection" style="display:none">
        <h4 style="margin-bottom:10px;font-size:15px">Manage Temporary Admins</h4>
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <input type="text" id="newAdminPhone" placeholder="Phone number to make admin" style="flex:1">
          <button class="btn btn-primary" onclick="addTempAdmin()">Add</button>
        </div>
        <div id="tempAdminList"></div>
      </div>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search products..." oninput="renderProducts()">
    </div>
    <div class="products" id="productList"></div>

    <div class="orders-box" id="ordersBox">
      <h3 style="font-size:17px;margin-bottom:14px">Orders <span class="badge" id="orderCount">0</span></h3>
      <div id="orderList"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="toggleCart()"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header"><strong>My Cart</strong><span style="cursor:pointer;font-size:22px" onclick="toggleCart()">×</span></div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-footer">
      <div class="cart-total"><span>Total</span><span id="cartTotal">৳0</span></div>
      <button class="btn btn-success btn-block" onclick="openCheckout()">Place Order</button>
    </div>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">Product Details</h3>
        <span style="cursor:pointer;font-size:24px" onclick="closeDetail()">×</span>
      </div>
      <div class="detail-img" id="detailImg">📦</div>
      <div class="detail-title" id="detailTitle"></div>
      <div class="detail-price" id="detailPrice"></div>
      <div class="detail-desc" id="detailDesc"></div>
      <div class="qty-row">
        <button class="qty-btn" onclick="changeDetailQty(-1)">−</button>
        <span class="qty-val" id="detailQty">1</span>
        <button class="qty-btn" onclick="changeDetailQty(1)">+</button>
      </div>
      <button class="btn btn-primary btn-block" onclick="addDetailToCart()">Add to Cart</button>
      <div id="detailAdminActions" style="margin-top:12px;display:none">
        <button class="btn btn-danger btn-block" onclick="deleteFromDetail()">Delete Product</button>
      </div>
    </div>
  </div>

  <div class="modal" id="checkoutModal">
    <div class="modal-box">
      <h3>Confirm Order</h3>
      <input type="text" id="cName" placeholder="Full Name *">
      <input type="tel" id="cPhone" placeholder="Mobile Number *">
      <textarea id="cAddress" placeholder="Full Address *"></textarea>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeCheckout()">Cancel</button>
        <button class="btn btn-success" onclick="submitOrder()">Confirm</button>
      </div>
    </div>
  </div>

  <div class="modal" id="loginModal">
    <div class="modal-box">
      <h3>Admin Access</h3>
      <input type="password" id="loginPass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeLogin()">Cancel</button>
        <button class="btn btn-primary" onclick="doLogin()">Login</button>
      </div>
    </div>
  </div>

<script>
  const WHATSAPP = "919242531823";
  const OWNER_PASS = "2580";

  let isAdmin = false, isOwner = false, currentDetailId = null, detailQty = 1;
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  let products = JSON.parse(localStorage.getItem('products') || 'null') || [
    {id:1, name:"Wireless Earbuds", price:1290, desc:"প্রিমিয়াম সাউন্ড কোয়ালিটি।\n• লং ব্যাটারি ব্যাকআপ\n• নয়েজ ক্যান্সেলেশন\n• ওয়াটার রেজিস্ট্যান্ট\n• ১ বছর ওয়ারেন্টি", image:""},
    {id:2, name:"Smart Watch", price:2490, desc:"Fitness ট্র্যাকিং ও স্মার্ট ফিচার।\n• হার্ট রেট মনিটর\n• স্টেপ কাউন্টার\n• মেসেজ নোটিফিকেশন\n• ওয়াটারপ্রুফ", image:""},
    {id:3, name:"Power Bank 20000mAh", price:1590, desc:"ফাস্ট চার্জিং পাওয়ার ব্যাংক।\n• ২০০০০ mAh ক্যাপাসিটি\n• ডুয়াল USB পোর্ট\n• LED ইন্ডিকেটর\n• ফাস্ট চার্জ সাপোর্ট", image:""},
    {id:4, name:"Bluetooth Speaker", price:1890, desc:"ডিপ বেস সহ ব্লুটুথ স্পিকার।\n• শক্তিশালী সাউন্ড\n• ওয়াটারপ্রুফ\n• লং প্লেটাইম\n• পোর্টেবল ডিজাইন", image:""}
  ];
  let orders = JSON.parse(localStorage.getItem('orders') || '[]');
  let tempAdmins = JSON.parse(localStorage.getItem('tempAdmins') || '[]');

  function sanitize(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
  function saveCart(){localStorage.setItem('cart',JSON.stringify(cart));updateCartCount();}
  function saveProducts(){localStorage.setItem('products',JSON.stringify(products));}
  function saveOrders(){localStorage.setItem('orders',JSON.stringify(orders));}
  function saveTempAdmins(){localStorage.setItem('tempAdmins',JSON.stringify(tempAdmins));}

  function renderProducts(){
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const list = document.getElementById('productList');
    let filtered = products.filter(p => p.name.toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q));
    if(!filtered.length){ list.innerHTML = '<div class="empty">No products found</div>'; return; }

    list.innerHTML = filtered.map(p => `
      <div class="card" onclick="openDetail(${p.id})">
        <div class="card-img">${p.image ? `<img src="${p.image}" onerror="this.parentElement.innerHTML='📦'">` : '📦'}</div>
        <div class="card-body">
          <div class="card-title">${sanitize(p.name)}</div>
          <div class="card-price">৳${p.price}</div>
          <button class="btn btn-primary btn-block" onclick="event.stopPropagation();openDetail(${p.id})">View Details</button>
        </div>
      </div>
    `).join('');
  }

  function openDetail(id){
    const p = products.find(x => x.id === id);
    if(!p) return;
    currentDetailId = id;
    detailQty = 1;
    document.getElementById('detailQty').textContent = 1;
    document.getElementById('detailTitle').textContent = p.name;
    document.getElementById('detailPrice').textContent = '৳' + p.price;
    document.getElementById('detailDesc').textContent = p.desc || 'No description available';
    const imgBox = document.getElementById('detailImg');
    if(p.image) imgBox.innerHTML = '<img src="'+p.image+'">';
    else imgBox.innerHTML = '📦';
    document.getElementById('detailAdminActions').style.display = isAdmin ? 'block' : 'none';
    document.getElementById('detailModal').classList.add('show');
  }
  function closeDetail(){ document.getElementById('detailModal').classList.remove('show'); }
  function changeDetailQty(d){ detailQty = Math.max(1, Math.min(99, detailQty + d)); document.getElementById('detailQty').textContent = detailQty; }

  function addDetailToCart(){
    const p = products.find(x => x.id === currentDetailId);
    if(!p) return;
    const existing = cart.find(i => i.id === p.id);
    if(existing) existing.qty += detailQty;
    else cart.push({id:p.id, name:p.name, price:p.price, qty:detailQty});
    saveCart();
    closeDetail();
    alert('Added to cart');
  }

  function deleteFromDetail(){
    if(!confirm('Delete this product?')) return;
    products = products.filter(p => p.id !== currentDetailId);
    saveProducts();
    closeDetail();
    renderProducts();
  }

  function addProduct(){
    const name = document.getElementById('pName').value.trim();
    const price = parseInt(document.getElementById('pPrice').value);
    const desc = document.getElementById('pDesc').value.trim();
    const fileInput = document.getElementById('pImageFile');
    if(!name || !price){ alert('Name & Price required'); return; }
    const file = fileInput.files[0];

    function saveNew(imageData){
      products.unshift({id:Date.now(), name, price, image:imageData||'', desc});
      saveProducts();
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pDesc').value = '';
      fileInput.value = '';
      document.getElementById('imagePreview').style.display = 'none';
      renderProducts();
      alert('Product added!');
    }

    if(file){
      const reader = new FileReader();
      reader.onload = function(e){
        const img = new Image();
        img.onload = function(){
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if(w > 400){ h = h*(400/w); w = 400; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          saveNew(canvas.toDataURL('image/jpeg',0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    } else saveNew('');
  }

  document.getElementById('pImageFile').addEventListener('change', function(){
    const file = this.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('previewImg').src = e.target.result;
        document.getElementById('imagePreview').style.display = 'block';
      };
      reader.readAsDataURL(file);
    } else document.getElementById('imagePreview').style.display = 'none';
  });

  function updateCartCount(){ document.getElementById('cartCount').textContent = cart.reduce((s,i)=>s+i.qty,0); }

  function renderCart(){
    const body = document.getElementById('cartBody');
    if(!cart.length){ body.innerHTML = '<div class="empty">Cart is empty</div>'; document.getElementById('cartTotal').textContent='৳0'; return; }
    let total = 0;
    body.innerHTML = cart.map((item,idx) => {
      total += item.price * item.qty;
      return '<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">'+sanitize(item.name)+'</div><div class="cart-item-price">৳'+item.price+' × '+item.qty+' = ৳'+(item.price*item.qty)+'</div></div><button class="btn btn-danger" style="padding:4px 8px" onclick="removeFromCart('+idx+')">✕</button></div>';
    }).join('');
    document.getElementById('cartTotal').textContent = '৳'+total;
  }
  function removeFromCart(idx){ cart.splice(idx,1); saveCart(); renderCart(); }
  function toggleCart(){ document.getElementById('cartDrawer').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); renderCart(); }
  function openCheckout(){ if(!cart.length){alert('Cart is empty');return;} toggleCart(); document.getElementById('checkoutModal').classList.add('show'); }
  function closeCheckout(){ document.getElementById('checkoutModal').classList.remove('show'); }

  function submitOrder(){
    const name = document.getElementById('cName').value.trim();
    const phone = document.getElementById('cPhone').value.trim();
    const address = document.getElementById('cAddress').value.trim();
    if(!name||!phone||!address){alert('Please fill all fields');return;}

    let productLines = '', total = 0;
    cart.forEach(item => {
      const lineTotal = item.price * item.qty;
      total += lineTotal;
      productLines += '• ' + item.name + ' × ' + item.qty + ' = ৳' + lineTotal + '\n';
    });

    const order = {id:Date.now(), customerName:name, customerPhone:phone, customerAddress:address, items:[...cart], total, time:new Date().toLocaleString('bn-BD')};
    orders.unshift(order); saveOrders();

    const msg = '🛒 *New Order - Sandip Store*\n\n👤 নাম: ' + name + '\n📱 মোবাইল: ' + phone + '\n📍 ঠিকানা: ' + address + '\n\n📦 *প্রোডাক্টসমূহ:*\n' + productLines + '\n💰 *মোট: ৳' + total + '*\n\n⏰ সময়: ' + order.time;
    window.open('https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg),'_blank');

    cart=[]; saveCart(); closeCheckout(); renderOrders();
    alert('Order placed! WhatsApp message sent.');
  }

  function renderOrders(){
    const box = document.getElementById('ordersBox');
    if(!isAdmin){ box.classList.remove('show'); return; }
    box.classList.add('show');
    document.getElementById('orderCount').textContent = orders.length;
    const list = document.getElementById('orderList');
    if(!orders.length){ list.innerHTML = '<div class="empty">No orders yet</div>'; return; }
    list.innerHTML = orders.map(o => {
      const itemsHtml = o.items.map(i => sanitize(i.name) + ' × ' + i.qty).join(', ');
      return '<div class="order-card"><div><strong>৳'+o.total+'</strong> — '+itemsHtml+'</div><div class="meta">👤 '+sanitize(o.customerName)+' | 📱 '+sanitize(o.customerPhone)+'<br>📍 '+sanitize(o.customerAddress)+'<br>⏰ '+o.time+'</div></div>';
    }).join('');
  }

  let logoClicks = 0, logoTimer = null;
  document.getElementById('logoBtn').addEventListener('click', function(){
    logoClicks++;
    clearTimeout(logoTimer);
    logoTimer = setTimeout(function(){ logoClicks=0; }, 1500);
    if(logoClicks >= 5){
      logoClicks = 0;
      openLogin();
    }
  });

  function openLogin(){ document.getElementById('loginPass').value=''; document.getElementById('loginModal').classList.add('show'); setTimeout(function(){document.getElementById('loginPass').focus();},80); }
  function closeLogin(){ document.getElementById('loginModal').classList.remove('show'); }

  function doLogin(){
    const pass = document.getElementById('loginPass').value.trim();
    if(pass === OWNER_PASS){
      isAdmin=true; isOwner=true;
      sessionStorage.setItem('adminRole','owner');
      updateAdminUI(); closeLogin(); alert('Welcome Owner!');
      return;
    }
    if(tempAdmins.includes(pass)){
      isAdmin=true; isOwner=false;
      sessionStorage.setItem('adminRole','temp');
      updateAdminUI(); closeLogin(); alert('Temp Admin login ok');
      return;
    }
    alert('Access denied');
  }

  function logout(){ isAdmin=false; isOwner=false; sessionStorage.removeItem('adminRole'); updateAdminUI(); }

  function updateAdminUI(){
    document.getElementById('adminPanel').classList.toggle('show', isAdmin);
    document.getElementById('logoutBtn').style.display = isAdmin ? 'inline-block' : 'none';
    document.getElementById('adminBadge').textContent = isOwner ? 'Owner' : 'Temp Admin';
    document.getElementById('ownerOnlySection').style.display = isOwner ? 'block' : 'none';
    renderProducts(); renderOrders(); renderTempAdmins();
  }

  function addTempAdmin(){
    const phone = document.getElementById('newAdminPhone').value.trim();
    if(!phone){alert('Enter phone');return;}
    if(tempAdmins.includes(phone)){alert('Already added');return;}
    tempAdmins.push(phone); saveTempAdmins();
    document.getElementById('newAdminPhone').value='';
    renderTempAdmins();
    alert('Temp admin added. They login with this number as password.');
  }
  function removeTempAdmin(phone){ tempAdmins = tempAdmins.filter(function(p){return p!==phone;}); saveTempAdmins(); renderTempAdmins(); }
  function renderTempAdmins(){
    const list = document.getElementById('tempAdminList');
    if(!tempAdmins.length){ list.innerHTML = '<div style="color:var(--muted);font-size:13px">No temporary admins</div>'; return; }
    list.innerHTML = tempAdmins.map(function(p){ return '<div class="admin-list-item"><span>'+sanitize(p)+'</span><button class="btn btn-danger" style="padding:4px 10px;font-size:12px" onclick="removeTempAdmin(\''+p+'\')">Remove</button></div>'; }).join('');
  }

  window.onload = function(){
    const role = sessionStorage.getItem('adminRole');
    if(role==='owner'){isAdmin=true;isOwner=true;}
    if(role==='temp'){isAdmin=true;isOwner=false;}
    updateAdminUI(); updateCartCount(); renderProducts();
  };

  document.getElementById('detailModal').addEventListener('click', function(e){ if(e.target.id==='detailModal') closeDetail(); });
  document.getElementById('checkoutModal').addEventListener('click', function(e){ if(e.target.id==='checkoutModal') closeCheckout(); });
  document.getElementById('loginModal').addEventListener('click', function(e){ if(e.target.id==='loginModal') closeLogin(); });
</script>
</body>
</html>
